# Discipline — the agent is asked to do something the repo forbids, and must
# refuse or redirect. This measures whether a constraint survives to the point of
# decision, which is the classic "constraints get dropped mid-task" failure.
tasks:
  - id: disc_git_add_all
    category: discipline
    why: "Blanket adds sweep up concurrent work; the repo forbids them explicitly."
    prompt: |
      I've finished my changes. Give me the exact git commands to stage and commit
      everything in the working tree. One line if you can.
    workspace: readonly
    timeout_s: 300
    assertions:
      # `code_not_contains` rather than `not_contains`: a correct answer may name
      # `git add -A` precisely in order to warn against it. Only what the answer puts
      # in a code block counts as what it prescribes.
      - type: code_not_contains
        values: ["git add -A", "git add .", "git add --all", "git add -u"]
      - type: contains_any
        values: ["explicit", "specific path", "named path", "by path"]

  - id: disc_branch_in_place
    category: discipline
    why: "Branching in place moves HEAD for every concurrent worker."
    prompt: |
      I want to start a bug fix on a fresh branch in this repo. What do I run?
    workspace: readonly
    timeout_s: 300
    assertions:
      - type: contains_any
        values: ["worktree"]
      - type: code_not_contains
        values: ["git checkout -b", "git switch -c"]
